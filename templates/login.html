<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANTA - Admin Login</title>
  <style>
    :root {
      --bg: #050505;
      --text: #f7f4ee;
      --muted: #a8a29a;
      --line: rgba(255, 255, 255, 0.14);
      --warm: #d7c4a2;
      --danger: #ff7d7d;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 22px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 18%, rgba(168, 216, 198, 0.14), transparent 28%),
        radial-gradient(circle at 84% 12%, rgba(215, 196, 162, 0.16), transparent 24%),
        var(--bg);
      color: var(--text);
    }

    form {
      width: min(430px, 100%);
      border: 1px solid var(--line);
      background: rgba(10, 10, 10, 0.86);
      padding: clamp(24px, 6vw, 38px);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
    }

    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--warm);
      margin-bottom: 26px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 48px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    p {
      margin: 14px 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 0 13px;
      background: #070707;
      border: 1px solid var(--line);
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--warm);
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 14px;
      background: var(--text);
      color: #080808;
      border: 0;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .error {
      margin: 14px 0 0;
      color: var(--danger);
      font-weight: 800;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      color: var(--muted);
      text-decoration: none;
    }

    a:hover {
      color: var(--warm);
    }
  </style>
</head>
<body>
  <form method="post">
    <div class="mark">V</div>
    <h1>VANTA Admin</h1>
    <p>Acceso interno para revisar pedidos de la tienda.</p>
    <input type="password" name="password" placeholder="Contrase&ntilde;a" autocomplete="current-password" autofocus />
    <button type="submit">Entrar</button>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <a href="/">Volver a la tienda</a>
  </form>
</body>
</html>
