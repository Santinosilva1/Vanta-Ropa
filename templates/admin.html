<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANTA - Admin</title>
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(13, 13, 13, 0.86);
      --text: #f7f4ee;
      --muted: #a8a29a;
      --line: rgba(255, 255, 255, 0.13);
      --warm: #d7c4a2;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 14%, rgba(168, 216, 198, 0.11), transparent 28%),
        radial-gradient(circle at 78% 0%, rgba(215, 196, 162, 0.13), transparent 26%),
        var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .shell {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(5, 5, 5, 0.78);
      backdrop-filter: blur(18px);
    }

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--warm);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    a {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      padding: 0 14px;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-size: 12px;
    }

    a:hover {
      border-color: var(--warm);
      color: var(--warm);
    }

    main {
      padding: clamp(42px, 7vw, 82px) 0;
    }

    .hero-admin {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 76px);
      line-height: 0.95;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .muted {
      color: var(--muted);
      line-height: 1.65;
    }

    #orders {
      display: grid;
      gap: 14px;
    }

    .order {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .order h3 {
      margin: 0;
      font-size: 22px;
      text-transform: uppercase;
    }

    .total {
      color: var(--warm);
      font-size: 22px;
      font-weight: 900;
    }

    .customer {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .field {
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      overflow-wrap: anywhere;
    }

    .field span {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    ul {
      margin: 0;
      padding-left: 18px;
      color: #d4cec5;
      line-height: 1.8;
    }

    li {
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .topbar,
      .hero-admin {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions,
      .actions a {
        width: 100%;
      }

      .customer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell topbar">
      <div class="brand">
        <span class="mark">V</span>
        <span>VANTA Admin</span>
      </div>
      <div class="actions">
        <a href="/">Volver a la tienda</a>
        <a href="/admin/logout">Salir</a>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="hero-admin">
      <div>
        <h1>Pedidos</h1>
        <p class="muted">Ordenes recibidas desde el checkout de la tienda.</p>
      </div>
    </section>
    <div id="orders"></div>
  </main>

  <script>
    function formatPrice(price) {
      return Number(price).toLocaleString("es-AR");
    }

    async function loadOrders() {
      const response = await fetch("/api/orders");
      const orders = await response.json();
      const container = document.getElementById("orders");

      if (orders.length === 0) {
        container.innerHTML = "<p class='muted'>Todavia no hay pedidos.</p>";
        return;
      }

      container.innerHTML = orders.map(order => `
        <article class="order">
          <div class="order-top">
            <div>
              <h3>Pedido #${order.id}</h3>
              <p class="muted">${order.created_at}</p>
            </div>
            <div class="total">$${formatPrice(order.total)}</div>
          </div>
          <div class="customer">
            <div class="field"><span>Cliente</span>${order.customer_name}</div>
            <div class="field"><span>Telefono</span>${order.customer_phone}</div>
            <div class="field"><span>Email</span>${order.customer_email || "Sin email"}</div>
          </div>
          <ul>
            ${order.items.map(item => `
              <li>${item.product_name} | Talle: ${item.size} | Cantidad: ${item.quantity} | $${formatPrice(item.price * item.quantity)}</li>
            `).join("")}
          </ul>
        </article>
      `).join("");
    }

    loadOrders();
  </script>
</body>
</html>
