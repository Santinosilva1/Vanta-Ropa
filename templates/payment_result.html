<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANTA - Pago</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050505; color: white; font-family: Arial, sans-serif; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 20px; }
    h1 { font-size: clamp(28px, 6vw, 52px); letter-spacing: 6px; margin-bottom: 16px; }
    p { color: #999; letter-spacing: 2px; margin-bottom: 32px; }
    a { border: 1px solid white; padding: 14px 32px; color: white; text-decoration: none; letter-spacing: 3px; transition: 0.3s; }
    a:hover { background: white; color: black; }
  </style>
</head>
<body>
  {% if status == "success" %}
    <h1>GRACIAS</h1>
    <p>Tu pago fue aprobado. Nos contactamos pronto.</p>
  {% elif status == "failure" %}
    <h1>ERROR</h1>
    <p>Hubo un problema con el pago. Intenta de nuevo.</p>
  {% else %}
    <h1>PENDIENTE</h1>
    <p>Tu pago está siendo procesado.</p>
  {% endif %}
  <a href="/">VOLVER A LA TIENDA</a>
</body>
</html>
